# The core install has no argocd-server, and argocd-server is what normally creates the "default" project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: ['*']
  destinations:
    - {server: '*', namespace: '*'}
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
