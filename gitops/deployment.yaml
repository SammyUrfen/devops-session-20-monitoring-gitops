apiVersion: apps/v1
kind: Deployment
metadata:
  name: session20-mini
  namespace: session20
  labels:
    app: session20-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session20-mini
  template:
    metadata:
      labels:
        app: session20-mini
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
